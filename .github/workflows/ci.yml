name: CI Suite - Impostor Chase

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax and Bytecode Compilation
        run: |
          python -m py_compile server/server.py server/game_state.py server/test_game_state.py server/test_reconnect_flow.py

      - name: Execute Server Unit Tests
        run: |
          python -m unittest discover -s server -p "test_*.py" -v

      - name: Validate Client JavaScript Syntax
        run: |
          node --check client/js/network.js
          node --check client/js/game.js
          node --check client/js/ui.js
          node --check client/js/audio.js
